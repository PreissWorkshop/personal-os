# Central project registry — read by humans and AI agents.
# Rule: local paths are per-machine "canonical roots". Sessions and agents
# scope to one root; never work a project from another project's root.

machines:
  cnc-pc:   "DESKTOP-A60V7P2 — shop PC at the CNC machine; HelmCNC only; keep lean"
  main-pc:  "primary dev workstation (the RDP source); full C:\\Projects layout"
  laptop:   "Samsung travel machine; clones on demand"

projects:
  - id: personal-os
    name: personal-os (this repo)
    status: active
    repo: https://github.com/PreissWorkshop/personal-os
    roots:
      cnc-pc:  C:\Projects\_system\personal-os
      main-pc: C:\Projects\_system\personal-os
      laptop:  C:\Projects\_system\personal-os

  - id: helm-cnc
    name: HelmCNC
    status: active — shipping product; live production machine attached to cnc-pc
    repos:
      app:  https://github.com/PreissWorkshop/helmcnc-app    # private dev repo, branch master
      site: https://github.com/PreissWorkshop/HelmCNC        # public site + releases
    roots:
      cnc-pc: C:\HelmCNC.bak        # THE dev tree (name is historical — do not "clean up")
      # C:\HelmCNC is the installed operator app — never a repo, never touched by dev work.
      # Site repo checkout on cnc-pc: C:\HelmCNC.bak\GitHub\HelmCNC
      main-pc: C:\Projects\HelmCNC\app     # optional off-shop clone
      laptop:  C:\Projects\HelmCNC\app     # optional
    notes: >
      Build/deploy/suite procedure lives in-tree (CLAUDE.md + HELMCNC_NOTES.md)
      and is binding. Machine-critical neighbors on cnc-pc: KMotion*,
      FlexiCAM-AmpBackups, HelmCNC-StateBackups, HelmCNC-Signing (secrets).
      See docs/filesystem.md.

  - id: scan-pen
    name: ScanPen / Scan Pen Probe
    status: active — Phase 1; development moved OFF cnc-pc (2026-08)
    repo: https://github.com/PreissWorkshop/scanpen    # fresh-start history 2026-08-16
    roots:
      cnc-pc:  C:\ScanPen                  # frozen full-history archive; retire after laptop verified
      main-pc: C:\Projects\ScanPen\repo
      laptop:  C:\Projects\ScanPen\repo
    data:
      captures: >
        Big mp4 takes live OUTSIDE git: full archive at
        D:\ScanPen-backup-2026-08-16 (USB stick) and original C:\ScanPen\capture
        on cnc-pc. Copy takes to a machine only when re-analyzing real footage;
        the synthetic suite runs without them.

  - id: preiss-website
    name: Preiss Workshop website
    status: active — redesign; newest work on feature/fable-design-refinement (2026-07-13, on origin)
    repo: https://github.com/PreissWorkshop/preiss-workshop-website
    roots:
      main-pc: C:\PREISS_WEBSITE\website   # + worktrees preiss-workshop-{codex,design-polish,fable} beside it
      laptop:  C:\Projects\PreissWebsite\website
    data:
      photos: >
        Raw photos live OUTSIDE git, on main-pc only: C:\PREISS_WEBSITE\PHOTOS_RAW
        (17 GB) and C:\PREISS_WEBSITE\photos_new (9.9 GB); Logo .ai sources and
        reference-only sit beside them. The repo carries only optimized copies
        (~34 MB under public/images) — the site builds and previews without the
        raws. New-photo picks/optimization happen on main-pc, or carry the
        needed originals over by USB/cloud.
    notes: >
      Static generated site, stdlib Python only: build `python src/site/build.py`,
      preview `python -m http.server 8790 -d public`. In-tree rules are binding:
      AGENT_WORKFLOW.md (+ FABLE-HANDOFF.md, PROGRESS.md). Never merge to main
      without Tenis's OK. Clone via HTTPS; the repo-local SSH deploy key on
      main-pc (.ssh-local/, untracked) has a broken file ACL as of 2026-08-21.
